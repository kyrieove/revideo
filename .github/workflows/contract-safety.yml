name: Narrative contract safety

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  safety-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy opencv-python-headless
      - name: Install video test prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
      - name: Compile touched modules
        run: |
          python -m py_compile \
            scripts/shot_contract.py scripts/gap_analyzer.py \
            scripts/material_index.py scripts/smart_match.py \
            scripts/smart_compose.py scripts/smart_workflow.py \
            scripts/remake.py tests/test_contract_safety_regression.py
      - name: Run contract safety tests
        run: python -m unittest discover -s tests -p test_contract_safety_regression.py -v
      - name: Run existing composition and contract tests
        run: |
          python -m unittest discover -s tests -p test_shot_contract.py -v
          python -m unittest discover -s tests -p test_smart_compose.py -v
          python -m unittest discover -s tests -p test_diversity.py -v
      - name: Run complete unittest suite
        run: python -m unittest discover -s tests -v
      - name: Run tools gate (维护源回归与媒体测试)
        run: python -B -X utf8 tools/check_revideo.py --fast
